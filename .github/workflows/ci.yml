name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Python source style
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: "0.16.8"
          args: "check --select E4,E7,E9,F --exclude backend/vendor"
          src: backend

  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install backend test dependencies
        run: |
          echo "9ced9b491908b453a31a4b2598c1ec5fbbddf106dff868adcfe36bd5e60124c2  vendor/langchain-google-firestore/dist/langchain_google_firestore-0.5.0.post2-py3-none-any.whl" | sha256sum -c -
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1 setuptools==83.0.0

      - name: Check active lock is self-contained
        run: python -m pip install --dry-run --ignore-installed --require-hashes -r requirements.lock

      - name: Run backend tests
        run: pytest

      - name: Remove local package before dependency audit
        run: python -m pip uninstall --yes dmbok-compass-backend

      - name: Audit Python dependencies
        run: |
          # The maintained Firestore wheel is checksum-verified above but its
          # post-release version is intentionally absent from PyPI. Audit
          # every registry dependency in the active lock independently.
          sed '/^--find-links /d; /^langchain-google-firestore==/,/^    # via /d' requirements.lock > "$RUNNER_TEMP/requirements-audit.lock"
          pip-audit --strict --no-deps -r "$RUNNER_TEMP/requirements-audit.lock"

  image-snapshot:
    name: Final image snapshot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the final application image
        run: docker build --file backend/Dockerfile --tag "dmbok-compass-snapshot:${GITHUB_SHA}" backend
      - name: Exercise API and evaluation job inside the final image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/backend/tests/test_image_snapshot.py:/tmp/test_image_snapshot.py:ro" \
            --env FINAL_IMAGE_SMOKE=1 \
            --env EXPECTED_LOCK_SHA256="$(sha256sum backend/requirements.lock | cut -d ' ' -f1)" \
            --env IMAGE_ARTIFACT_ID="$(docker image inspect "dmbok-compass-snapshot:${GITHUB_SHA}" --format '{{.Id}}')" \
            "dmbok-compass-snapshot:${GITHUB_SHA}" \
            python -m pytest -q -s /tmp/test_image_snapshot.py

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .
      - name: Initialize Terraform providers
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate

  langchain-compat:
    name: Python 3.11 Linux contract image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and run compatibility contracts
        run: docker build --file backend/compat/Dockerfile --tag dmbok-langchain-compat:${{ github.sha }} backend
