name: Pull request quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install backend test dependencies
        run: |
          echo "9ced9b491908b453a31a4b2598c1ec5fbbddf106dff868adcfe36bd5e60124c2  vendor/langchain-google-firestore/dist/langchain_google_firestore-0.5.0.post2-py3-none-any.whl" | sha256sum -c -
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1 setuptools==83.0.0

      - name: Check active lock is self-contained
        run: python -m pip install --dry-run --ignore-installed --require-hashes -r requirements.lock

      - name: Run backend tests
        run: pytest

      - name: Remove local package before dependency audit
        run: python -m pip uninstall --yes dmbok-compass-backend

      - name: Audit Python dependencies
        run: |
          # The maintained Firestore wheel is checksum-verified above but its
          # post-release version is intentionally absent from PyPI. Audit
          # every registry dependency in the active lock independently.
          sed '/^--find-links /d; /^langchain-google-firestore==/,/^    # via /d' requirements.lock > "$RUNNER_TEMP/requirements-audit.lock"
          pip-audit --strict --no-deps -r "$RUNNER_TEMP/requirements-audit.lock"

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .
      - name: Initialize Terraform providers
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate
