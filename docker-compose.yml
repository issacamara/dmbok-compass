services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-dev-dmbok-compass}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-europe-west1}
      RAG_VECTOR_COLLECTION: ${RAG_VECTOR_COLLECTION:-document_chunks_v2}
      RAG_VECTOR_SCHEMA_VERSION: ${RAG_VECTOR_SCHEMA_VERSION:-2}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-gemini-embedding-001}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-768}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-dense}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-openrouter}
      ANSWER_REQUEST_TIMEOUT_MS: ${ANSWER_REQUEST_TIMEOUT_MS:-14000}
      ANSWER_GENERATION_TIMEOUT_MS: ${ANSWER_GENERATION_TIMEOUT_MS:-8000}
      ANSWER_OUTPUT_TOKEN_CAP: ${ANSWER_OUTPUT_TOKEN_CAP:-1024}
      ANSWER_MAX_MODEL_ATTEMPTS: ${ANSWER_MAX_MODEL_ATTEMPTS:-2}
      RUNTIME_SECRET_VERSION: ${RUNTIME_SECRET_VERSION:-local-dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-meta-llama/llama-3.1-8b-instruct}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-google/gemma-4-26b-a4b-it:free}
      OPENROUTER_JSON_SCHEMA_SUPPORTED: ${OPENROUTER_JSON_SCHEMA_SUPPORTED:-true}
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_AUTH_EMULATOR_HOST: ${VITE_FIREBASE_AUTH_EMULATOR_HOST:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
