[project]
name = "dmbok-compass-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin>=6.6,<8.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "google-genai>=1.0,<2.0",
  "pypdf>=6.19,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=9.0,<10.0"]

[tool.setuptools.packages.find]
include = ["app*", "model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
