[project]
name = "dmbok-compass-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin==6.6.0",
  "fastapi>=0.130.0,<1.0.0",
  "starlette==1.3.1",
  "httpx==0.28.1",
  "langchain-core==1.3.3",
  "langsmith==0.8.18",
  "google-cloud-firestore==2.32.0",
  "google-cloud-storage==3.15.0",
  "google-genai==1.75.0",
  "pypdf==6.19.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["app*", "model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
