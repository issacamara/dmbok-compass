name: Immutable delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: GCP/GitHub environment to deploy
        required: true
        default: development
        type: choice
        options: [development, production]
      promote:
        description: Promote the reviewed preview to production
        required: true
        default: false
        type: boolean
      release_decision:
        description: Release decision identifier required for promotion
        required: false
        type: string
      corpus_version_id:
        description: Immutable corpus version bound to this delivery
        required: false
        type: string
      rollback:
        description: Create a coupled rollback preflight plan (never changes traffic)
        required: true
        default: false
        type: boolean
      rollback_run_id:
        description: Workflow run containing the previous promoted delivery evidence
        required: false
        type: string
      owner_approved:
        description: Owner approval for a protected rollback preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-west1
  API_SERVICE: dmbok-compass-api
  INGESTION_JOB: dmbok-compass-ingestion
  EVALUATION_JOB: dmbok-compass-evaluation
  HOSTING_SITE: dmbok-compass

jobs:
  preview:
    name: Build and preview immutable release
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'development' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.target_environment || 'development' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CORPUS_BUCKET_NAME: ${{ vars.CORPUS_BUCKET_NAME }}
      BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      IMAGE_REPOSITORY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dmbok-compass
      HOSTING_SITE: ${{ vars.HOSTING_SITE }}
      CORPUS_VERSION_ID: ${{ inputs.corpus_version_id || vars.CORPUS_VERSION_ID }}
      CORPUS_COLLECTION: document_chunks_v2
      CORPUS_SCHEMA_VERSION: v2
      CORPUS_INDEX: document_chunks_v2_vector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/api:${{ github.sha }}

      - name: Build and hash frontend artifact
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
          tar -cf "$RUNNER_TEMP/frontend.tar" -C dist .
          sha256sum "$RUNNER_TEMP/frontend.tar" | cut -d' ' -f1 > "$RUNNER_TEMP/frontend.sha256"

      - name: Resolve immutable delivery manifest
        run: |
          api_digest="$(gcloud artifacts docker images describe "${IMAGE_REPOSITORY}/api:${GITHUB_SHA}" --format='value(image_summary.digest)')"
          test -n "$api_digest"
          frontend_digest="$(cat "$RUNNER_TEMP/frontend.sha256")"
          test -n "$CORPUS_VERSION_ID"
          configuration="$(jq -cn --arg collection "$CORPUS_COLLECTION" --arg schema "$CORPUS_SCHEMA_VERSION" --arg index "$CORPUS_INDEX" --arg request_timeout "28000" --arg generation_timeout "16000" --arg provider "openrouter" '{collection: $collection, schema_version: $schema, index: $index, request_timeout_ms: $request_timeout, generation_timeout_ms: $generation_timeout, provider: $provider}')"
          configuration_digest="$(printf '%s' "$configuration" | sha256sum | cut -d' ' -f1)"
          jq -n --arg commit "$GITHUB_SHA" --arg image "${IMAGE_REPOSITORY}/api@${api_digest}" \
            --arg digest "$api_digest" --arg frontend_digest "$frontend_digest" \
            --arg corpus_version "$CORPUS_VERSION_ID" --arg collection "$CORPUS_COLLECTION" \
            --arg schema "$CORPUS_SCHEMA_VERSION" --arg index "$CORPUS_INDEX" --arg configuration_digest "$configuration_digest" \
            '{commit: $commit, api_image: $image, admin_image: $image, api_digest: $digest, frontend_digest: $frontend_digest, api_schema_version: $schema, serving_binding: {corpus_version_id: $corpus_version, collection: $collection, schema_version: $schema, index: $index, configuration_digest: $configuration_digest}, preview_revision: "", release_revision: ""}' \
            > "$RUNNER_TEMP/delivery-manifest.json"

      - name: Plan Terraform against immutable image
        working-directory: infra/terraform
        run: |
          terraform init -backend-config="backends/${DEPLOY_ENVIRONMENT}.hcl" -reconfigure -input=false
          terraform plan -input=false -refresh=false -out="$RUNNER_TEMP/delivery.tfplan" \
            -var="project_id=${PROJECT_ID}" -var="corpus_bucket_name=${CORPUS_BUCKET_NAME}" \
            -var="billing_account_id=${BILLING_ACCOUNT_ID}" \
            -var="api_image=$(jq -r .api_image "$RUNNER_TEMP/delivery-manifest.json")" \
            -var="corpus_version_id=${CORPUS_VERSION_ID}"
          terraform show -no-color "$RUNNER_TEMP/delivery.tfplan" > "$RUNNER_TEMP/delivery.tfplan.txt"

      - name: Deploy zero-traffic API preview
        run: |
          api_image="$(jq -r .api_image "$RUNNER_TEMP/delivery-manifest.json")"
          gcloud run deploy "$API_SERVICE" --image="$api_image" --region="$REGION" \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},RAG_VECTOR_COLLECTION=${CORPUS_COLLECTION},RAG_CORPUS_VERSION_ID=${CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=${CORPUS_SCHEMA_VERSION},RAG_VECTOR_INDEX=${CORPUS_INDEX},EVALUATION_JOB_NAME=${EVALUATION_JOB},ANSWER_PROVIDER=openrouter,ANSWER_REQUEST_TIMEOUT_MS=28000,ANSWER_GENERATION_TIMEOUT_MS=16000,OPENROUTER_PRIMARY_MODEL=mistralai/mistral-nemo,OPENROUTER_FALLBACK_MODEL=meta-llama/llama-3.1-8b-instruct" \
            --platform=managed --no-traffic --quiet --format='value(status.latestCreatedRevisionName)' \
            > "$RUNNER_TEMP/preview_revision"
          revision="$(cat "$RUNNER_TEMP/preview_revision")"
          test -n "$revision"
          jq --arg revision "$revision" '.preview_revision = $revision' "$RUNNER_TEMP/delivery-manifest.json" \
            > "$RUNNER_TEMP/delivery-manifest.updated.json"
          mv "$RUNNER_TEMP/delivery-manifest.updated.json" "$RUNNER_TEMP/delivery-manifest.json"

      - name: Deploy Firebase preview channel
        run: |
          preview_channel="commit-${GITHUB_SHA:0:7}"
          mkdir -p web/dist
          tar -xf "$RUNNER_TEMP/frontend.tar" -C web/dist
          firebase_dir="$RUNNER_TEMP/firebase-deploy"
          mkdir -p "$firebase_dir"
          cp -R web/dist "$firebase_dir/dist"
          jq -n --arg service "$API_SERVICE" --arg region "$REGION" \
            '{hosting: [{target: "app", public: "dist", rewrites: [{source: "/api/**", run: {serviceId: $service, region: $region}}]}]}' \
            > "$firebase_dir/firebase.json"
          jq -n --arg project "$PROJECT_ID" --arg site "$HOSTING_SITE" \
            '{projects: {default: $project}, targets: {($project): {hosting: {app: [$site]}}}}' \
            > "$firebase_dir/.firebaserc"
          (cd "$firebase_dir" && npx --yes firebase-tools@13 hosting:channel:deploy "$preview_channel" \
            --project="$PROJECT_ID" --expires 7d --non-interactive)

      - name: Deploy preview jobs
        run: |
          api_image="$(jq -r .api_image "$RUNNER_TEMP/delivery-manifest.json")"
          gcloud run jobs deploy "$INGESTION_JOB" --image="$api_image" --region="$REGION" \
            --update-env-vars="RAG_VECTOR_COLLECTION=${CORPUS_COLLECTION},RAG_CORPUS_VERSION_ID=${CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=${CORPUS_SCHEMA_VERSION},RAG_VECTOR_INDEX=${CORPUS_INDEX}" --quiet
          gcloud run jobs deploy "$EVALUATION_JOB" --image="$api_image" --region="$REGION" \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},RAG_VECTOR_COLLECTION=${CORPUS_COLLECTION},RAG_CORPUS_VERSION_ID=${CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=${CORPUS_SCHEMA_VERSION},RAG_VECTOR_INDEX=${CORPUS_INDEX},ANSWER_PROVIDER=openrouter,ANSWER_REQUEST_TIMEOUT_MS=28000,ANSWER_GENERATION_TIMEOUT_MS=16000,OPENROUTER_PRIMARY_MODEL=mistralai/mistral-nemo,OPENROUTER_FALLBACK_MODEL=meta-llama/llama-3.1-8b-instruct" \
            --quiet

      - name: Validate and upload release evidence
        run: |
          python3 scripts/verify_delivery_manifest.py "$RUNNER_TEMP/delivery-manifest.json"
          mkdir -p "$RUNNER_TEMP/delivery-evidence/web"
          cp "$RUNNER_TEMP/delivery-manifest.json" "$RUNNER_TEMP/delivery-evidence/delivery-manifest.json"
          cp "$RUNNER_TEMP/delivery.tfplan.txt" "$RUNNER_TEMP/delivery-evidence/delivery.tfplan.txt"
          cp "$RUNNER_TEMP/frontend.tar" "$RUNNER_TEMP/delivery-evidence/frontend.tar"
          cp -R web/dist/. "$RUNNER_TEMP/delivery-evidence/web/"

      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/delivery-evidence
          if-no-files-found: error
          retention-days: 14

  promote:
    name: Promote reviewed release
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'development' }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      IMAGE_REPOSITORY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dmbok-compass
      HOSTING_SITE: ${{ vars.HOSTING_SITE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate promotion input
        env:
          RELEASE_DECISION: ${{ inputs.release_decision }}
        run: test -n "$RELEASE_DECISION"

      - name: Download release evidence
        uses: actions/download-artifact@v4
        with:
          name: delivery-evidence-${{ github.sha }}
          path: delivery-evidence

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote exact preview artifacts
        env:
          RELEASE_DECISION: ${{ inputs.release_decision }}
        run: |
          python3 scripts/verify_delivery_manifest.py delivery-evidence/delivery-manifest.json
          revision="$(jq -r .preview_revision delivery-evidence/delivery-manifest.json)"
          test -n "$revision"
          gcloud run services update-traffic "$API_SERVICE" --region="$REGION" \
            --to-revisions="${revision}=100" --quiet
          firebase_dir="$RUNNER_TEMP/firebase-deploy"
          mkdir -p "$firebase_dir"
          tar -xf delivery-evidence/frontend.tar -C "$firebase_dir"
          jq -n --arg service "$API_SERVICE" --arg region "$REGION" \
            '{hosting: [{target: "app", public: ".", rewrites: [{source: "/api/**", run: {serviceId: $service, region: $region}}]}]}' \
            > "$firebase_dir/firebase.json"
          jq -n --arg project "$PROJECT_ID" --arg site "$HOSTING_SITE" \
            '{projects: {default: $project}, targets: {($project): {hosting: {app: [$site]}}}}' \
            > "$firebase_dir/.firebaserc"
          (cd "$firebase_dir" && npx --yes firebase-tools@13 deploy \
            --project="$PROJECT_ID" --non-interactive)
          jq --arg decision "$RELEASE_DECISION" --arg revision "$revision" \
            '.release_decision = $decision | .release_revision = $revision' \
            delivery-evidence/delivery-manifest.json > delivery-evidence/delivery-manifest.promoted.json

      - name: Publish promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: promoted-delivery-evidence-${{ github.sha }}
          path: delivery-evidence
          if-no-files-found: error
          retention-days: 30

  rollback-preflight:
    name: Preflight coupled rollback
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback == true && inputs.target_environment == 'production' && inputs.owner_approved == true }}
    runs-on: ubuntu-latest
    # GitHub's protected production environment supplies the existing approval gate.
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: delivery-evidence-${{ github.sha }}
          path: candidate-evidence

      - name: Download previous promoted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          test -n "$ROLLBACK_RUN_ID"
          gh run download "$ROLLBACK_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir previous-evidence
          test -n "$(find previous-evidence -path '*/promoted-delivery-evidence-*/*' -name delivery-manifest.json -print -quit)"

      - name: Validate coupled rollback plan
        run: |
          previous_manifest="$(find previous-evidence -path '*/promoted-delivery-evidence-*/*' -name delivery-manifest.json -print -quit)"
          python3 scripts/delivery/rollback.py \
            --candidate candidate-evidence/delivery-manifest.json \
            --previous "$previous_manifest" \
            --output coupled-rollback-plan.json \
            --protected-gate-approved --owner-approved

      - name: Publish coupled rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: coupled-rollback-preflight-${{ github.sha }}
          path: coupled-rollback-plan.json
          if-no-files-found: error
          retention-days: 30
