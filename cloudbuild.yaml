steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "--file", "backend/Dockerfile", "--tag", "${_IMAGE_REPOSITORY}/api:${COMMIT_SHA}", "backend"]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args: ["push", "${_IMAGE_REPOSITORY}/api:${COMMIT_SHA}"]

  - id: build-frontend
    name: node:22
    dir: web
    entrypoint: bash
    args: ["-ceu", "npm ci && npm run build && tar -cf /workspace/frontend.tar -C dist . && sha256sum /workspace/frontend.tar | cut -d' ' -f1 > /workspace/frontend.sha256"]

  - id: resolve-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-api, build-frontend]
    entrypoint: bash
    args:
      - -ceu
      - |
        api_digest="$(gcloud artifacts docker images describe "${_IMAGE_REPOSITORY}/api:${COMMIT_SHA}" --format='value(image_summary.digest)')"
        test -n "${api_digest}"
        frontend_digest="$(cat /workspace/frontend.sha256)"
        test -n "${frontend_digest}"
        corpus_version_id="${_CORPUS_VERSION_ID}"
        test "${corpus_version_id}" != "replace-with-reviewed-corpus-version"
        python3 - "${COMMIT_SHA}" "${_IMAGE_REPOSITORY}/api@${api_digest}" "${api_digest}" "${frontend_digest}" "${corpus_version_id}" <<'PY' > /workspace/delivery-manifest.json
        import hashlib
        import json
        import sys

        commit, image, digest, frontend_digest, corpus_version_id = sys.argv[1:]
        configuration = {
            "collection": "document_chunks_v2",
            "schema_version": "v2",
            "index": "document_chunks_v2_vector",
            "request_timeout_ms": "14000",
            "generation_timeout_ms": "8000",
            "provider": "openrouter",
        }
        manifest = {
            "commit": commit,
            "api_image": image,
            "admin_image": image,
            "api_digest": digest,
            "frontend_digest": frontend_digest,
            "api_schema_version": "v2",
            "serving_binding": {
                "corpus_version_id": corpus_version_id,
                "collection": configuration["collection"],
                "schema_version": configuration["schema_version"],
                "index": configuration["index"],
                "configuration_digest": hashlib.sha256(
                    json.dumps(configuration, sort_keys=True, separators=(",", ":")).encode()
                ).hexdigest(),
            },
            "preview_revision": "",
            "release_revision": "",
        }
        print(json.dumps(manifest, separators=(",", ":")))
        PY

  - id: terraform-plan
    name: hashicorp/terraform:1.9
    dir: infra/terraform
    waitFor: [resolve-digest]
    entrypoint: sh
    args:
      - -ceu
      - |
        terraform init -backend=false -input=false
        terraform plan -input=false -refresh=false -out=/workspace/delivery.tfplan \
          -var="project_id=${PROJECT_ID}" \
          -var="corpus_bucket_name=${_CORPUS_BUCKET_NAME}" \
          -var="api_image=$(sed -n 's/.*"api_image":"\([^"]*\)".*/\1/p' /workspace/delivery-manifest.json)" \
          -var="corpus_version_id=${_CORPUS_VERSION_ID}"
        terraform show -no-color /workspace/delivery.tfplan > /workspace/delivery.tfplan.txt

  - id: preview-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [terraform-plan]
    entrypoint: bash
    args:
      - -ceu
      - |
        api_image="$(sed -n 's/.*"api_image":"\([^"]*\)".*/\1/p' /workspace/delivery-manifest.json)"
        gcloud run deploy "${_API_SERVICE}" --image="${api_image}" --region="${_REGION}" --platform=managed \
          --update-env-vars="RAG_VECTOR_COLLECTION=document_chunks_v2,RAG_CORPUS_VERSION_ID=${_CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=v2,RAG_VECTOR_INDEX=document_chunks_v2_vector" \
          --no-traffic --quiet --format='value(status.latestCreatedRevisionName)' > /workspace/preview_revision
        revision="$(cat /workspace/preview_revision)"
        test -n "${revision}"
        python3 - <<'PY'
        import json
        from pathlib import Path
        manifest = json.loads(Path('/workspace/delivery-manifest.json').read_text())
        manifest['preview_revision'] = Path('/workspace/preview_revision').read_text().strip()
        Path('/workspace/delivery-manifest.json').write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
        PY

  - id: preview-frontend
    name: node:22
    waitFor: [terraform-plan, build-frontend]
    entrypoint: bash
    args:
      - -ceu
      - |
        npm install --global firebase-tools@13
        tar -xf /workspace/frontend.tar -C web/dist
        firebase hosting:channel:deploy "${_PREVIEW_CHANNEL}" --only "hosting:${_HOSTING_SITE}" --project="${PROJECT_ID}" --expires 7d --non-interactive

  - id: preview-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [terraform-plan]
    entrypoint: bash
    args:
      - -ceu
      - |
        api_image="$(sed -n 's/.*"api_image":"\([^"]*\)".*/\1/p' /workspace/delivery-manifest.json)"
        gcloud run jobs deploy "${_INGESTION_JOB}" --image="${api_image}" --region="${_REGION}" \
          --update-env-vars="RAG_VECTOR_COLLECTION=document_chunks_v2,RAG_CORPUS_VERSION_ID=${_CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=v2,RAG_VECTOR_INDEX=document_chunks_v2_vector" --quiet
        gcloud run jobs deploy "${_EVALUATION_JOB}" --image="${api_image}" --region="${_REGION}" \
          --update-env-vars="RAG_VECTOR_COLLECTION=document_chunks_v2,RAG_CORPUS_VERSION_ID=${_CORPUS_VERSION_ID},RAG_SCHEMA_VERSION=v2,RAG_VECTOR_INDEX=document_chunks_v2_vector" --quiet

  - id: write-evidence
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [preview-api, preview-frontend, preview-jobs]
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 scripts/verify_delivery_manifest.py /workspace/delivery-manifest.json
        cp /workspace/delivery-manifest.json delivery-manifest.json
        cp /workspace/delivery.tfplan.txt delivery.tfplan.txt

  - id: promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [write-evidence]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_PROMOTE}" != "true" ]]; then
          echo "Promotion is disabled; sponsor release decision is required."
          exit 0
        fi
        [[ "${_RELEASE_APPROVED}" == "true" ]]
        [[ -n "${_RELEASE_DECISION}" ]]
        python3 scripts/verify_delivery_manifest.py delivery-manifest.json
        revision="$(sed -n 's/.*"preview_revision":"\([^"]*\)".*/\1/p' delivery-manifest.json)"
        test -n "${revision}"
        gcloud run services update-traffic "${_API_SERVICE}" --region="${_REGION}" --to-revisions="${revision}=100" --quiet
        npm install --global firebase-tools@13
        firebase deploy --only hosting:"${_HOSTING_SITE}" --project="${PROJECT_ID}" --non-interactive

images:
  - "${_IMAGE_REPOSITORY}/api:${COMMIT_SHA}"

substitutions:
  _API_SERVICE: dmbok-compass-api
  _CORPUS_BUCKET_NAME: replace-with-reviewed-bucket
  _CORPUS_VERSION_ID: replace-with-reviewed-corpus-version
  _HOSTING_SITE: dmbok-compass
  _INGESTION_JOB: dmbok-compass-ingestion
  _IMAGE_REPOSITORY: europe-west1-docker.pkg.dev/$PROJECT_ID/dmbok-compass
  _PREVIEW_CHANNEL: commit-$SHORT_SHA
  _PROMOTE: "false"
  _RELEASE_APPROVED: "false"
  _RELEASE_DECISION: ""
  _REGION: europe-west1
  _EVALUATION_JOB: dmbok-compass-evaluation

options:
  logging: CLOUD_LOGGING_ONLY
