[project]
name = "dmbok-compass-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin==6.6.0",
  "fastapi==0.143.0",
  "starlette==1.3.1",
  "httpx==0.28.1",
  "langchain-core==1.6.10",
  "langchain-community==0.4.2",
  "langchain-text-splitters==1.1.3",
  "langchain-google-genai==4.4.1",
  "langchain-openrouter==0.2.9",
  "langchain-google-firestore==0.5.0.post2",
  "langsmith==0.14.7",
  "google-cloud-firestore==2.32.0",
  "google-cloud-storage==3.15.0",
  "google-auth==2.61.0",
  "google-genai==2.29.0",
  "openrouter==0.11.46",
  "pypdf==6.21.2",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["app*", "model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
