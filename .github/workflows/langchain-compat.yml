name: LangChain compatibility image

on:
  pull_request:
    paths:
      - ".github/workflows/langchain-compat.yml"
      - "backend/compat/**"
      - "backend/requirements-compat.lock"
      - "backend/vendor/langchain-google-firestore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python311-linux:
    name: Python 3.11 Linux contract image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and run compatibility contracts
        run: docker build --file backend/compat/Dockerfile --tag dmbok-langchain-compat:${{ github.sha }} backend
